[package]
name = "quod-client-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.2.16"
pbkdf2 = "=0.12.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
zeroize = { version = "=1.8.2", features = ["derive"] }

