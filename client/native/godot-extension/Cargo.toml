[package]
name = "quod-godot"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "=0.5.5", default-features = false, features = ["api-4-5", "experimental-threads"] }
quod-client-core = { path = "../core" }
serde_json = "=1.0.145"
