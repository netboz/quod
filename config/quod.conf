# quod configuration (HOCON). This FILE is the primary source of config; OS env
# vars prefixed QUOD_ override individual scalar keys (e.g. QUOD_NODE__PORT=15000).
# The `content` LIST is not env-overridable — deploys render this file.
# Path is overridable with QUOD_CONF=/path/to/quod.conf.

node {
  ip   = "127.0.0.1"
  port = 14567
  # QUIC liveness: a peer we haven't heard from for idle_timeout_ms is dropped;
  # keepalive_ms PINGs probe an otherwise-quiet link. Dead-peer detection ~= the
  # two summed (~2.5s). Tuned for a low-RTT LAN; raise both for a lossier/WAN path,
  # and keep keepalive_ms well below idle_timeout_ms.
  idle_timeout_ms = 2000
  keepalive_ms    = 500
}

metrics {
  port = 14568
}

# The browser/XR client and authenticated Explorer, fixed challenge-response
# authentication, and one predicate-neutral signed-goal API for reads, writes,
# and cursors. Agent enrollment uses that same API. The listener remains
# disabled in local development.
#
# Always HTTPS — a browser hides Web Crypto outside a secure context, so over
# plaintext the client could not generate, unlock or sign with a key at all.
# Leave both PEM paths empty to serve the node's own self-signed browser
# certificate (kept beside the identity key, renewed automatically); set them to
# use a real certificate instead.
client {
  enabled  = false
  ip       = "127.0.0.1"
  port     = 14570
  certfile = ""
  keyfile  = ""
}

# The node's Ed25519 identity keypair (its node_id = the pubkey). Generated on first
# boot and persisted; `dir = ""` ⇒ <first content data_dir>/identity (shares the ledger
# volume). One identity per node, however many ontologies it hosts.
identity {
  # dir = ""
}

# Live ontology routing. `allowlist` is exact: keys authorized for one namespace
# gain no authority over another. Records are signed and expire; routes never
# enter the ontology ledger. `direct_seeds` are private/local and are not
# returned by directory_host/5.
directory {
  allowlist = [
    # {
    #   namespace = "quod:root"
    #   node_keys = ["64-character-ed25519-public-key-hex"]
    # }
  ]
  direct_seeds = [
    # {
    #   namespace = "character_42:arm"
    #   seeds = ["private-arm.example:14567"]
    # }
  ]
}

# The ontologies this node founds (create) or joins at boot — a LIST; a node may host
# several side by side. They may share one data_dir: the ledger keeps each namespace
# in its own subdirectory.
content = [
  {
    namespace    = "quod:root"
    mode         = create                      # create | join (honored on first boot only)
    genesis_file = "ontologies/quod_root.pl"   # read once by the founder at create
    # data_dir   = "/var/lib/quod"             # unset ⇒ quod_ledger user_cache default
    seeds        = []                          # ["host:port", ...] — join discovery
    max_proof_workers = 64                     # per-ontology client proof backpressure
    max_scope_workers = 64                     # per-ontology selected-scope backpressure
    proof_timeout_ms  = 60000                  # absolute lifetime of one client proof
    transaction_ttl_ms = 30000                 # local wait for a proved write's final outcome
    batch_window_ms   = 25                     # collect ordinary writes before sealing a block (0 = immediate)
    scope_timeout_ms  = 60000                  # absolute lifetime of one selected proof scope
    scope_step_timeout_ms = 30000              # maximum runtime of one active scope derivation
  }
]
