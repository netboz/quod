# quod configuration (HOCON). This FILE is the primary source of config; OS env
# vars prefixed QUOD_ override individual scalar keys (e.g. QUOD_NODE__PORT=15000).
# The `content` LIST is not env-overridable — deploys render this file.
# Path is overridable with QUOD_CONF=/path/to/quod.conf.

node {
  ip   = "127.0.0.1"
  port = 14567
  # QUIC liveness: a peer we haven't heard from for idle_timeout_ms is dropped;
  # keepalive_ms PINGs probe an otherwise-quiet link. Dead-peer detection ~= the
  # two summed (~2.5s). Tuned for a low-RTT LAN; raise both for a lossier/WAN path,
  # and keep keepalive_ms well below idle_timeout_ms.
  idle_timeout_ms = 2000
  keepalive_ms    = 500
}

metrics {
  port = 14568
}

# The node's Ed25519 identity keypair (its node_id = the pubkey). Generated on first
# boot and persisted; `dir = ""` ⇒ <first content data_dir>/identity (shares the ledger
# volume). One identity per node, however many ontologies it hosts.
identity {
  # dir = ""
}

# The ontologies this node founds (create) or joins at boot — a LIST; a node may host
# several side by side. They may share one data_dir: the ledger keeps each namespace
# in its own subdirectory.
content = [
  {
    namespace    = "quod:root"
    mode         = create                      # create | join (honored on first boot only)
    genesis_file = "ontologies/quod_root.pl"   # read once by the founder at create
    # data_dir   = "/var/lib/quod"             # unset ⇒ quod_ledger user_cache default
    seeds        = []                          # ["host:port", ...] — join discovery
    max_proof_workers = 64                     # per-ontology client proof backpressure
    max_ask_workers   = 64                     # per-ontology foreign-answer backpressure
    proof_timeout_ms  = 60000                  # absolute lifetime of one client proof
    park_ttl_ms       = 30000                  # local wait for a proved write's final outcome
    ask_timeout_ms    = 60000                  # absolute lifetime of one served foreign ask
    ask_step_timeout_ms = 30000                # no-progress limit while deriving one answer
  }
]
