[package]
name = "quod_physics"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rapier3d = { version = "=0.36.0", default-features = false, features = ["dim3", "f32", "std", "solver-bounds-checks"] }
rustler = "=0.36.2"

[profile.release]
panic = "unwind"
overflow-checks = true

