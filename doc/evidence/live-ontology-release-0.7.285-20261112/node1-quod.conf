node {
  ip        = "192.168.1.11"
  port      = 27862
  bind_port = 14567
  consensus_owner_tracing = false
}
metrics { port = 14568 }
agent_vault {
  enabled = true
  directory = "/quod/data/agent-keys"
  unlock_file = "/quod/data/agent-vault.unlock"
}
# The web explorer is off by DEFAULT (unauthenticated surface whose prove endpoint writes); the fleet
# opts in explicitly and binds all interfaces so Nomad's explorer /health check can reach it. This
# is a private cluster; do not copy `ip = "0.0.0.0"` to an internet-exposed deployment.
explorer {
  enabled = true
  ip      = "0.0.0.0"
  port    = 14569
}
# HTTPS, with the node's own self-signed certificate: a browser withholds Web
# Crypto outside a secure context, so over plaintext the client could not hold a
# key at all. Visitors accept the certificate once per node.
client {
  enabled  = true
  ip       = "0.0.0.0"
  port     = 14570
  certfile = ""
  keyfile  = ""
}
# `content` is a LIST: further ontologies are added as extra entries, each with its own
# mode/anchor (founded once by a single create deploy, then joined fleet-wide with the
# logged anchor — same two-phase dance as quod:root; they share /quod/data, the ledger
# keeps one subdirectory per namespace).
content = [
  {
    namespace = "quod:root"
    # data_dir is the fast local host volume mounted at /quod/data — identity, vote
    # journal, and ledger all live here now, so ledger_dir (the 0.7.36 Ceph workaround)
    # is no longer needed.
    data_dir  = "/quod/data"
    max_proof_workers = 64
    max_scope_workers = 64
    proof_timeout_ms = 300000
    transaction_ttl_ms = 30000
    batch_window_ms = 25
    scope_timeout_ms = 300000
    scope_step_timeout_ms = 30000
    detailed_consensus_metrics = false

    mode         = join
    genesis_hash = "C21E011BC94C7B69AD56A4227BED085EF2FA7C536458A5457C410256C1FD3F5E"
    seeds        = [
      "192.168.1.12:25617",
      "192.168.1.10:25044",
      "192.168.1.10:23762",
      "192.168.1.10:30401",
      "192.168.1.11:23330",
      "192.168.1.11:27862",
      "192.168.1.11:25491",
      "100.98.216.20:23836",
    ]

  }
]
