<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quod — Matrix walls: the source of the space class</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000000; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #8FA596; }
  .stage { width: min(100%, 1200px, calc((100vh - 64px) * 12 / 7)); min-width: 480px; margin: 0 auto; background: #000000; }
  .view { width: 100%; aspect-ratio: 12 / 7; background: #000000; overflow: hidden; }
  .view canvas { display: block; width: 100%; height: 100%; background: #000000; }
  .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 22px; padding: 9px 14px;
           background: #050705; border-top: 1px solid #0d140f; font-size: 12px; line-height: 1; white-space: nowrap; }
  .group { display: flex; align-items: center; gap: 10px; }
  .group > b { font-weight: 600; color: #5F7566; }
  .strip label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .strip input { margin: 0; accent-color: #00B140; cursor: pointer; }
  .cap { margin-left: auto; color: #4A5C50; }
</style>
</head>
<body>
<div class="stage">
  <div class="view" id="view"><canvas id="room"></canvas></div>
  <div class="strip">
    <div class="group"><b>Letters</b>
      <label><input type="radio" name="letters" value="written" checked> As written</label>
      <label><input type="radio" name="letters" value="mirrored"> Mirrored</label>
    </div>
    <div class="group"><b>Size</b>
      <label><input type="radio" name="size" value="0.025"> Small</label>
      <label><input type="radio" name="size" value="0.035" checked> Medium</label>
      <label><input type="radio" name="size" value="0.05"> Large</label>
    </div>
    <div class="group"><b>Glow</b>
      <label><input type="checkbox" name="glow" checked> On</label>
    </div>
    <div class="group"><b>Leading glyph</b>
      <label><input type="radio" name="heads" value="all" checked> Every column</label>
      <label><input type="radio" name="heads" value="fifth"> One column in five</label>
    </div>
    <div class="group"><b>Corner lines</b>
      <label><input type="checkbox" name="lines" checked> On</label>
    </div>
    <div class="group"><b>Floor and ceiling</b>
      <label><input type="radio" name="planes" value="black" checked> Black</label>
      <label><input type="radio" name="planes" value="rain"> Rain</label>
    </div>
    <span class="cap">Matrix walls: the source of the space class</span>
  </div>
</div>

      var pz1 = Z_FRONT - marginX - j * cell, pz0 = pz1 - cell;
      if (pz0 < 0.08 || f * 0.5 / pz1 > PH / 2 + cellPx) break;
      var pzm = 2 / (1 / pz0 + 1 / pz1);
      planeRows.push({ k: f / pzm, a: f * cell / pzm / atlasS.cellPx, e: f * cell / (pzm * pzm) / atlasS.cellPx });
    }

    // Corner lines: each visible edge starts at a corner and fades out a third of the way along.
    var hw = ROOM_W / 2, fades = [];
    function P(x, y, z) { return [cx + f * x / z, cy + f * y / z]; }
    function fade(x0, y0, z0, x1, y1, z1) {              // from the corner to a third of the edge
      var stops = [], a = P(x0, y0, z0), b = P(x1, y1, z1), len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      for (var q = 0; q <= 8; q++) {
        var w = q / 8, p = P(x0 + (x1 - x0) * w, y0 + (y1 - y0) * w, z0 + (z1 - z0) * w);
        stops.push([Math.min(1, Math.hypot(p[0] - a[0], p[1] - a[1]) / len), 1 - w]);
      }
      fades.push({ a: a, b: b, stops: stops });
    }
    [-1, 1].forEach(function (sx) {
      [-1, 1].forEach(function (sy) {
        var x = sx * hw, y = sy * 0.5;
        fade(x, y, Z_FRONT, x - sx * ROOM_W / 3, y, Z_FRONT);          // along the front wall's top or bottom edge
        fade(x, y, Z_FRONT, x, y - sy / 3, Z_FRONT);                   // along the front wall's left or right edge
        fade(x, y, Z_FRONT, x, y, Z_FRONT - ROOM_D / 3);               // along the edge that runs toward the viewer
      });
    });

    G = { cell: cell, rows: rows, cx: cx, cy: cy, yw: yw, front: front, fy: fy, side: side,
          planeCols: planeCols, planeRows: planeRows, planeDepth: Math.floor(ROOM_D / cell + 1e-6),
          fades: fades, lineWidth: Math.max(1, 1.5 * dpr) };
  }

  // ---- frame ----
  function frame(now) {
    requestAnimationFrame(frame);
    if (dirty) { dirty = false; rebuild(); }
    if (!G) return;

    var t = now / 1000;
    var rows = G.rows, kL = G.cell / DROP_LEN, invKL = DROP_LEN / G.cell, allHeads = opt.allHeads;
    var c, r, col, base, u, n, ph, hc, lv, b, w, ci, S, img;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, PW, PH);
    ctx.globalCompositeOperation = 'lighter';

    // Brightness of a cell: b = 1 - fract((t * speed + offset - row * k) / dropLength), then b^1.5.
    // floor() of the same value counts the passes; the cell takes its next character when it steps.

    // front wall, flat, pixel-aligned
    S = atlasF.S; img = atlasF.canvas;
    for (c = 0; c < G.front.length; c++) {
      col = G.front[c].col; base = (t * FALL * col.speed + col.offset) / DROP_LEN;
      var x = G.front[c].x;
      for (r = 0; r < rows; r++) {
        u = base - r * kL; n = Math.floor(u); ph = u - n; hc = ph * invKL;
        if (hc < 1 && (allHeads || col.head)) {
          w = hc < 0.5 ? 0 : (hc - 0.5) * 2;
          lv = NT + Math.round(w * (NH - 1));
        } else {
          b = 1 - ph; lv = ((b * Math.sqrt(b) * NT + 0.5) | 0) - 1;
          if (lv < 0) continue;
        }
        ci = codes[(((col.start + r + n * rows) % N) + N) % N];
        ctx.drawImage(img, ci * S, lv * S, S, S, x, G.fy[r], S, S);
      }
    }

    // left and right walls, one affine cell at a time
    S = atlasS.S; img = atlasS.canvas;
    var half = S / 2, cx = G.cx, cy = G.cy, yw = G.yw, limit = PH / 2;
    for (c = 0; c < G.side.length; c++) {
      var sc = G.side[c];
      col = sc.col; base = (t * FALL * col.speed + col.offset) / DROP_LEN;
      var reach = limit + sc.s * G.cell;
      for (r = 0; r < rows; r++) {
        var dy = sc.s * yw[r];
        if (dy > reach || dy < -reach) continue;
        u = base - r * kL; n = Math.floor(u); ph = u - n; hc = ph * invKL;
        if (hc < 1 && (allHeads || col.head)) {
          w = hc < 0.5 ? 0 : (hc - 0.5) * 2;
          lv = NT + Math.round(w * (NH - 1));
        } else {
          b = 1 - ph; lv = ((b * Math.sqrt(b) * NT + 0.5) | 0) - 1;
          if (lv < 0) continue;
        }
        ci = codes[(((col.start + r + n * rows) % N) + N) % N];
        ctx.setTransform(sc.a, -dy / (cx - sc.xm) * sc.a, 0, sc.d, sc.xm, cy + dy);
        ctx.drawImage(img, ci * S, lv * S, S, S, -half, -half, S, S);
      }
    }

    // floor and ceiling; the row index counts cells away from the front wall
    if (opt.planeRain) {
      var depth = G.planeDepth, pr, pc, sgn;
      for (c = 0; c < G.planeCols.length; c++) {
        pc = G.planeCols[c];
        for (sgn = -1; sgn <= 1; sgn += 2) {             // -1 ceiling, +1 floor
          col = sgn < 0 ? pc.ceil : pc.floor; base = (t * FALL * col.speed + col.offset) / DROP_LEN;
          for (r = 0; r < G.planeRows.length; r++) {
            pr = G.planeRows[r];
            var px = cx + pc.xw * pr.k;
            if (px < -S || px > PW + S) continue;
            u = base - r * kL; n = Math.floor(u); ph = u - n; hc = ph * invKL;
            if (hc < 1 && (allHeads || col.head)) {
              w = hc < 0.5 ? 0 : (hc - 0.5) * 2;
              lv = NT + Math.round(w * (NH - 1));
            } else {
              b = 1 - ph; lv = ((b * Math.sqrt(b) * NT + 0.5) | 0) - 1;
              if (lv < 0) continue;
            }
            ci = codes[(((col.start + r + n * depth) % N) + N) % N];
            // sgn keeps the letters unmirrored on the ceiling (they are turned, not flipped)
            ctx.setTransform(sgn * pr.a, 0, pc.xw * pr.e, sgn * 0.5 * pr.e, px, cy + sgn * 0.5 * pr.k);
            ctx.drawImage(img, ci * S, lv * S, S, S, -half, -half, S, S);
          }
        }
      }
    }

    if (opt.lines) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = G.lineWidth; ctx.lineCap = 'butt';
      for (c = 0; c < G.fades.length; c++) {
        var fd = G.fades[c], grad = ctx.createLinearGradient(fd.a[0], fd.a[1], fd.b[0], fd.b[1]);
        for (r = 0; r < fd.stops.length; r++) grad.addColorStop(fd.stops[r][0], 'rgba(' + LINE + ',' + fd.stops[r][1] + ')');
        ctx.strokeStyle = grad;
        ctx.beginPath(); ctx.moveTo(fd.a[0], fd.a[1]); ctx.lineTo(fd.b[0], fd.b[1]); ctx.stroke();
      }
    }
  }

  // ---- controls ----
  function readControls() {
    opt.mirror = document.querySelector('input[name=letters]:checked').value === 'mirrored';
    opt.size = parseFloat(document.querySelector('input[name=size]:checked').value);
    opt.glow = document.querySelector('input[name=glow]').checked;
    opt.allHeads = document.querySelector('input[name=heads]:checked').value === 'all';
    opt.lines = document.querySelector('input[name=lines]').checked;
    opt.planeRain = document.querySelector('input[name=planes]:checked').value === 'rain';
    dirty = true;
  }
  document.querySelector('.strip').addEventListener('change', readControls);
  readControls();
  if (window.ResizeObserver) new ResizeObserver(function () { dirty = true; }).observe(view);
  else window.addEventListener('resize', function () { dirty = true; });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
